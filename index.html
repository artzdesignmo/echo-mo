<!DOCTYPE html>
<html lang="en" data-theme="silver">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo Mo — Generative Ambient Music Studio</title>
<meta name="description" content="Echo Mo: a generative ambient music studio. Every note composed by code, in real time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e8e6; --panel:rgba(247,247,245,.86); --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e;
  --line:#d8d8d4; --accent:#8a6f4d; --radius:14px; --danger:#c0392b;
}
[data-theme="white"]{ --bg:#f4f4f4; --panel:rgba(255,255,255,.88); --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e; --line:#e2e2e2; }
[data-theme="black"]{ --bg:#141414; --panel:rgba(30,30,30,.86); --card:#242424; --ink:#f2f2f2; --ink2:#a8a8a8; --line:#333; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; overflow:hidden; }
body{ font-family:'Noto Sans TC','Noto Sans',sans-serif; background:var(--bg); color:var(--ink); }
#cv{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
.serif{ font-family:'Cormorant Garamond','Noto Sans TC',serif; }
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background:linear-gradient(to bottom, var(--panel), transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.brand .t{ font-family:'Dela Gothic One'; font-size:20px; letter-spacing:2px; }
.brand .s{ font-size:10px; color:var(--ink2); letter-spacing:4px; margin-top:2px; }
.hctl{ display:flex; align-items:center; gap:10px; }
.seg{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
.seg button{ border:0; background:transparent; color:var(--ink2); padding:7px 13px; cursor:pointer; font-size:12px; font-weight:500; }
.seg button.on{ background:var(--ink); color:var(--bg); }
.tbtn{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); cursor:pointer; }
/* center stage */
#stage{
  position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
  align-items:center; justify-content:center; pointer-events:none; padding-bottom:30px;
}
#playBtn{
  pointer-events:auto; width:96px; height:96px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  transition:transform .25s, border-color .25s;
  animation:breathe 4.5s ease-in-out infinite;
}
#playBtn:hover{ transform:scale(1.05); border-color:var(--ink2); }
@keyframes breathe{ 0%,100%{ box-shadow:0 0 0 0 rgba(138,111,77,.16);} 50%{ box-shadow:0 0 0 24px rgba(138,111,77,0);} }
#playBtn svg{ width:34px; height:34px; fill:var(--ink); margin-left:4px; }
#playBtn.playing svg{ margin-left:0; }
#nowPlaying{ margin-top:28px; text-align:center; pointer-events:none; }
#nowPlaying .serif{ font-size:30px; letter-spacing:4px; color:var(--ink); display:block; font-style:italic; font-weight:300; }
#npSub{ font-size:13px; letter-spacing:4px; color:var(--ink2); font-weight:300; margin-top:8px; display:block; }
#sessInfo{ font-size:12px; letter-spacing:2px; color:var(--ink2); margin-top:10px; display:block; font-variant-numeric:tabular-nums; }
/* floating button + bottom sheet */
#fab{
  position:fixed; right:20px; bottom:20px; z-index:62;
  width:48px; height:48px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(0,0,0,.12);
  transition:transform .2s;
}
#fab:hover{ transform:scale(1.07); }
#sheet{
  position:fixed; left:50%; bottom:0; z-index:60;
  transform:translate(-50%,106%); transition:transform .38s cubic-bezier(.32,.72,.28,1);
  background:var(--panel); border:1px solid var(--line); border-bottom:0;
  border-radius:22px 22px 0 0;
  padding:10px 20px 28px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  display:flex; flex-direction:column; gap:10px; width:min(680px,96vw);
  max-height:74vh; overflow-y:auto; box-shadow:0 -8px 40px rgba(0,0,0,.12);
}
#sheet.open{ transform:translate(-50%,0); }
#grabber{ width:42px; height:4px; border-radius:2px; background:var(--line); margin:2px auto 6px; flex:none; }
#scrim{
  position:fixed; inset:0; z-index:59; background:rgba(0,0,0,.10);
  opacity:0; pointer-events:none; transition:opacity .3s;
}
#scrim.show{ opacity:1; pointer-events:auto; }
.sec .lbl{ font-size:10px; color:var(--ink2); letter-spacing:3px; margin-bottom:7px; text-align:center; }
.chips{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
.chip{
  border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:7px 15px; cursor:pointer; font-size:12.5px; color:var(--ink2);
  display:inline-flex; align-items:center; gap:7px; transition:all .2s;
}
.chip .dot{ width:9px; height:9px; border-radius:50%; }
.chip.on{ border-color:var(--accent); color:var(--ink); font-weight:600; }
.chip .x{ margin-left:2px; opacity:.55; font-size:13px; line-height:1; }
.chip .x:hover{ opacity:1; color:var(--danger); }
.chip.rec{ border-color:var(--danger); color:var(--danger); }
.chip.rec.on{ background:var(--danger); color:#fff; border-color:var(--danger); }
.rec-dot{ width:9px; height:9px; border-radius:50%; background:var(--danger); }
.chip.rec.on .rec-dot{ background:#fff; animation:blink 1.2s infinite; }
@keyframes blink{ 50%{ opacity:.35; } }
.sliders{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.sl{ display:flex; align-items:center; gap:9px; }
.sl .nm{ font-size:12px; color:var(--ink2); letter-spacing:1px; white-space:nowrap; }
.sl .val{ font-size:12px; color:var(--ink2); min-width:56px; text-align:right; font-variant-numeric:tabular-nums; }
input[type=range]{ width:104px; accent-color:var(--accent); cursor:pointer; }
#kbdHint{ text-align:center; font-size:10.5px; color:var(--ink2); letter-spacing:1px; opacity:.75; }
footer{ position:fixed; left:18px; bottom:18px; z-index:40; font-size:11px; color:var(--ink2); letter-spacing:1px; pointer-events:none; }
footer a{ color:var(--ink2); pointer-events:auto; }
@media (max-width:640px){
  .topbar{ padding:10px 14px; } .brand .t{ font-size:16px; }
  #playBtn{ width:78px; height:78px; }
  #stage{ padding-bottom:170px; }
  #sheet{ padding:10px 14px 24px; }
  #fab{ right:14px; bottom:14px; }
  input[type=range]{ width:80px; }
  footer,#kbdHint{ display:none; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="topbar">
  <div class="brand"><div class="t">ECHO MO</div><div class="s">GENERATIVE AMBIENT MUSIC</div></div>
  <div class="hctl">
    <div class="seg" id="langSeg"><button data-l="en" class="on">EN</button><button data-l="zh">中</button></div>
    <button class="tbtn" data-th="white" style="background:#fff" title="white"></button>
    <button class="tbtn" data-th="silver" style="background:#d8d8d8" title="silver"></button>
    <button class="tbtn" data-th="black" style="background:#222" title="black"></button>
  </div>
</div>
<div id="stage">
  <button id="playBtn" aria-label="play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
  <div id="nowPlaying">
    <span class="serif" id="npMood">Dawn</span>
    <span id="npSub"></span>
    <span id="sessInfo"></span>
  </div>
</div>
<button id="fab" aria-label="controls"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8a8e" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.3"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.3"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="7" cy="17" r="2.3"/></svg></button>
<div id="scrim"></div>
<div id="sheet">
  <div id="grabber"></div>
  <div class="sec"><div class="lbl" id="lblMood">MOOD</div><div class="chips" id="moods"></div></div>
  <div class="sec"><div class="lbl" id="lblVoice">VOICE</div><div class="chips" id="voices"></div></div>
  <div class="sec"><div class="sliders">
    <div class="sl"><span class="nm" id="nmTempo">Tempo</span><input type="range" id="sTempo" min="40" max="120" value="62"><span class="val" id="vTempo"></span></div>
    <div class="sl"><span class="nm" id="nmDensity">Density</span><input type="range" id="sDensity" min="0" max="100" value="45"><span class="val" id="vDensity"></span></div>
    <div class="sl"><span class="nm" id="nmVol">Volume</span><input type="range" id="sVol" min="0" max="100" value="70"><span class="val" id="vVol"></span></div>
  </div></div>
  <div class="sec"><div class="lbl" id="lblSession">SESSION</div><div class="chips" id="sessBtns"></div></div>
  <div class="sec" id="presetSec" style="display:none"><div class="lbl" id="lblPreset">PRESETS</div><div class="chips" id="presets"></div></div>
  <div id="kbdHint"></div>
</div>
<footer>ECHO MO · <span id="footTx"></span> · <a href="https://buymeacoffee.com/whynotartmoney" target="_blank" rel="noopener">Buy Me a Coffee</a></footer>
<script>
/* ================= i18n ================= */
const STR={
  en:{sub:'every note composed by code',foot:'every note composed by code',
      tempo:'Tempo',density:'Density',vol:'Volume',
      mood:'MOOD',voice:'VOICE',session:'SESSION',preset:'PRESETS',
      timerOff:'No timer',sessionMin:m=>m+' min',
      savePreset:'＋ Save preset',recStart:'● Record',recStop:'■ Stop & download',
      presetName:'Preset name:',sessionIdle:'ready',
      kbd:'Space play/pause · ←/→ mood · ↑/↓ volume',
      moods:[
        {n:'Dawn',d:'warm morning light'},{n:'Dusk',d:'amber hour'},
        {n:'Night',d:'deep indigo stillness'},{n:'Zen',d:'still water, single stone'},
        {n:'Ocean',d:'slow rolling waves'},{n:'Forest',d:'morning birdsong'}],
      voices:[{n:'Music Box'},{n:'Soft Piano'},{n:'Glass'},{n:'Strings'},{n:'Flute'},{n:'Kalimba'},{n:'Temple Bell'},{n:'Harp'}]},
  zh:{sub:'每一個音符都由代碼寫成',foot:'每一個音符都由代碼寫成',
      tempo:'速度',density:'密度',vol:'音量',
      mood:'心境',voice:'音色',session:'時段',preset:'預設',
      timerOff:'不設時',sessionMin:m=>m+' 分鐘',
      savePreset:'＋ 儲存預設',recStart:'● 錄音',recStop:'■ 停止並下載',
      presetName:'預設名稱：',sessionIdle:'就緒',
      kbd:'空白鍵 播放/暫停 · ←/→ 心境 · ↑/↓ 音量',
      moods:[
        {n:'晨',d:'溫暖的晨光'},{n:'暮',d:'琥珀色的黃昏'},
        {n:'夜',d:'深藍的靜'},{n:'禪',d:'靜水中的一顆石'},
        {n:'海',d:'緩緩的浪'},{n:'森',d:'清晨的鳥鳴'}],
      voices:[{n:'音樂盒'},{n:'柔鋼琴'},{n:'玻璃'},{n:'弦樂'},{n:'長笛'},{n:'卡林巴'},{n:'梵鐘'},{n:'豎琴'}]}
};
let lang='en';
const t=k=>STR[lang][k];
/* ================= data ================= */
const MOODS=[
  {id:'dawn', scale:[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25],
   root:261.63, prog:[0,2,4,3], orb:'#d9a45b', bg:['#f7ecd9','#e8d5b5'], line:'rgba(138,111,77,.35)', dust:'rgba(138,111,77,.22)'},
  {id:'dusk', scale:[220.00,261.63,293.66,329.63,392.00,440.00,523.25],
   root:220.00, prog:[0,3,4,2], orb:'#c47a6d', bg:['#f2ddd4','#dfc0b2'], line:'rgba(150,90,80,.35)', dust:'rgba(150,90,80,.22)'},
  {id:'night', scale:[146.83,174.61,196.00,220.00,261.63,293.66,349.23],
   root:146.83, prog:[0,4,3,2], orb:'#9db4d8', bg:['#1b2340','#0e1428'], line:'rgba(157,180,216,.30)', dust:'rgba(157,180,216,.20)'},
  {id:'zen', scale:[659.25,783.99,880.00,987.77,1174.66,1318.51],
   root:659.25, prog:[0,2,1,3], orb:'#8a8a8e', bg:['#f5f1e6','#e6dfcd'], line:'rgba(90,85,70,.35)', dust:'rgba(90,85,70,.18)'},
  {id:'ocean', scale:[329.63,392.00,440.00,493.88,587.33,659.25,783.99],
   root:329.63, prog:[0,3,4,1], orb:'#4d8fa8', bg:['#dcebf0','#b9d4de'], line:'rgba(77,143,168,.35)', dust:'rgba(77,143,168,.22)', waves:true},
  {id:'forest', scale:[523.25,587.33,659.25,783.99,880.00,1046.50,1174.66],
   root:523.25, prog:[0,4,2,3], orb:'#5d9a5f', bg:['#e4f0da','#c4ddb3'], line:'rgba(93,154,95,.35)', dust:'rgba(93,154,95,.22)'},
];
const VOICES=[
  {id:'musicbox', osc:[['sine',1,1],['triangle',0.12,2]], atk:0.025, dec:1.0},
  {id:'piano', osc:[['triangle',1,1],['sine',0.28,2],['sine',0.09,3]], atk:0.008, dec:0.65},
  {id:'glass', osc:[['sine',1,1],['sine',0.35,2.01]], atk:0.06, dec:1.7},
  {id:'strings', osc:[['sawtooth',0.65,1],['sawtooth',0.38,1.006]], atk:0.28, dec:1.3, cutoff:1400},
  {id:'flute', osc:[['sine',1,1],['sine',0.14,2]], atk:0.09, dec:1.1, vib:{rate:5.2,depth:0.006}},
  {id:'kalimba', osc:[['sine',1,1],['sine',0.30,4.2],['sine',0.12,9.3]], atk:0.005, dec:0.55},
  {id:'bell', osc:[['sine',1,1],['sine',0.5,2.76],['sine',0.25,5.4]], atk:0.01, dec:2.2},
  {id:'harp', osc:[['triangle',0.8,1],['sine',0.3,2]], atk:0.005, dec:0.9, cutoff:2600},
];
let curMood=0, curVoice=0;
/* ================= canvas ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=1,W=0,H=0;
function sizeCanvas(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
}
window.addEventListener('resize',sizeCanvas);sizeCanvas();
/* ================= audio ================= */
let AC=null,master,verb,playing=false;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.0001;master.connect(AC.destination);
  const len=AC.sampleRate*2.8, imp=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=imp.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);
  }
  verb=AC.createConvolver();verb.buffer=imp;
  const wet=AC.createGain();wet.gain.value=0.55;
  verb.connect(wet);wet.connect(master);
}
function playNote(freq,time,dur,vol){
  const V=VOICES[curVoice], g=AC.createGain();
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0012,vol),time+V.atk);
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur*V.dec+0.4);
  let bus=g;
  if(V.cutoff){
    const flt=AC.createBiquadFilter();flt.type='lowpass';flt.frequency.value=V.cutoff;flt.Q.value=0.4;
    flt.connect(g);bus=flt;
  }
  const oscs=[];
  for(const [type,mix,mult] of V.osc){
    const o=AC.createOscillator();o.type=type;o.frequency.value=freq*mult;
    const og=AC.createGain();og.gain.value=mix;
    o.connect(og);og.connect(bus);
    o.start(time);o.stop(time+dur*V.dec+0.6);
    oscs.push(o);
  }
  if(V.vib){
    const lfo=AC.createOscillator();lfo.frequency.value=V.vib.rate;
    const lg=AC.createGain();
    lg.gain.setValueAtTime(0.0001,time);
    lg.gain.linearRampToValueAtTime(freq*V.vib.depth,time+Math.min(0.4,dur*0.3));
    lfo.connect(lg);
    for(const o of oscs) lg.connect(o.frequency);
    lfo.start(time);lfo.stop(time+dur*V.dec+0.6);
  }
  g.connect(master);g.connect(verb);
}
function playPad(freqs,time,dur,vol){
  for(const fq of freqs){
    const o=AC.createOscillator();o.type='sine';o.frequency.value=fq;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,time);
    g.gain.linearRampToValueAtTime(vol,time+dur*0.35);
    g.gain.linearRampToValueAtTime(0.0001,time+dur);
    o.connect(g);g.connect(master);g.connect(verb);
    o.start(time);o.stop(time+dur+0.1);
  }
}
/* ================= generative engine ================= */
let schedTimer=null,nextTime=0,deg=3,beatCount=0,orbs=[],scoreDots=[];
let noteCount=0,sessionStart=0,sessTimerMin=0,sessTimeout=null;
const SL={
  tempo:()=>+document.getElementById('sTempo').value,
  density:()=>+document.getElementById('sDensity').value/100,
  vol:()=>+document.getElementById('sVol').value/100,
};
function refreshVals(){
  document.getElementById('vTempo').textContent=SL.tempo()+' bpm';
  document.getElementById('vDensity').textContent=Math.round(SL.density()*100)+'%';
  document.getElementById('vVol').textContent=Math.round(SL.vol()*100)+'%';
}
['sTempo','sDensity','sVol'].forEach(id=>document.getElementById(id).addEventListener('input',refreshVals));
function chordTones(M,step){
  const p=M.prog[step%M.prog.length], n=M.scale.length;
  const at=i=>{const k=((p+i)%n+n)%n, oct=Math.floor((p+i)/n);return M.scale[k]*Math.pow(2,oct);};
  return [at(0)/2, at(2)/2, at(4)/2]; // low warm voicing
}
function schedule(){
  const spb=60/SL.tempo();
  while(nextTime<AC.currentTime+0.4){
    const M=MOODS[curMood], dens=SL.density(), vol=SL.vol();
    const r=Math.random();
    if(r<0.55) deg+=Math.random()<0.5?-1:1;
    else if(r<0.78) deg+=Math.random()<0.5?-2:2;
    else if(r<0.93){/* repeat */}
    else deg+=Math.random()<0.5?-3:3;
    deg=Math.max(0,Math.min(M.scale.length-1,deg));
    if(Math.random()<0.3) deg+=Math.sign((M.scale.length-1)/2-deg);
    deg=Math.max(0,Math.min(M.scale.length-1,deg));
    const restP=0.72-dens*0.55+(curMood===3?0.18:0);
    if(Math.random()>restP){
      const freq=M.scale[deg];
      playNote(freq,nextTime,spb*(1.5+Math.random()*2.5),0.20*vol+0.05);
      spawnOrb(freq,nextTime);
      noteCount++;
      // ocean waves: occasional ascending run
      if(M.waves&&Math.random()<0.22){
        for(let k=1;k<=3;k++){
          const rf=M.scale[Math.min(M.scale.length-1,deg+k)];
          playNote(rf,nextTime+spb*0.28*k,spb*1.2,0.10*vol+0.02);
          spawnOrb(rf,nextTime+spb*0.28*k);
          noteCount++;
        }
      }
    }
    if(beatCount%16===0){
      const ct=chordTones(M,(beatCount/16)|0);
      playPad(ct,nextTime,spb*16,0.030*vol+0.004);
    }
    if(Math.random()<0.06+dens*0.05){
      playNote(M.scale[M.scale.length-1]*2,nextTime+spb*0.5,spb*4,0.055*vol);
    }
    beatCount++;
    nextTime+=spb*(Math.random()<dens*0.5?0.5:1);
  }
}
function spawnOrb(freq,atTime){
  const M=MOODS[curMood];
  const delay=Math.max(0,(atTime-AC.currentTime)*1000);
  setTimeout(()=>{
    const norm=(freq-M.scale[0])/(M.scale[M.scale.length-1]-M.scale[0]);
    orbs.push({x:W*(0.15+Math.random()*0.7), y:H*(0.55+Math.random()*0.25),
      r:5+norm*22+Math.random()*7, born:performance.now(), life:8000+Math.random()*3000,
      vx:(Math.random()-0.5)*10, vy:-12-Math.random()*14, hue:M.orb, pitch:norm});
    if(orbs.length>70) orbs.shift();
    scoreDots.push({x:W-70, pitch:norm, born:performance.now()});
    if(scoreDots.length>50) scoreDots.shift();
  },delay);
}
/* ================= transport ================= */
const playBtn=document.getElementById('playBtn'),playIcon=document.getElementById('playIcon');
function setPlaying(p){
  playing=p;
  playBtn.classList.toggle('playing',p);
  playIcon.innerHTML=p?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  if(p){
    initAudio();
    if(AC.state==='suspended') AC.resume();
    if(!sessionStart) sessionStart=Date.now();
    master.gain.cancelScheduledValues(AC.currentTime);
    master.gain.setTargetAtTime(SL.vol()*0.9+0.05,AC.currentTime,1.2); // gentle fade in
    nextTime=AC.currentTime+0.15;
    schedTimer=setInterval(schedule,120);
    if(sessTimerMin>0&&!sessTimeout){
      const remain=sessTimerMin*60000-(Date.now()-sessionStart);
      if(remain>0) sessTimeout=setTimeout(endSessionTimer,remain);
    }
  }else{
    clearInterval(schedTimer);
    if(sessTimeout){clearTimeout(sessTimeout);sessTimeout=null;}
    if(AC){
      master.gain.cancelScheduledValues(AC.currentTime);
      master.gain.setTargetAtTime(0.0001,AC.currentTime,0.8); // gentle fade out
    }
  }
}
function endSessionTimer(){
  sessTimeout=null;
  if(!AC) return;
  const M=MOODS[curMood];
  // closing bell
  playNote(M.root,AC.currentTime+0.1,8,0.15);
  playNote(M.root*1.5,AC.currentTime+0.6,8,0.10);
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(0.0001,AC.currentTime+1.5,3.5);
  setTimeout(()=>{ if(playing) setPlaying(false); },9000);
}
playBtn.onclick=()=>{sessionStart=playing?sessionStart:0;setPlaying(!playing);};
/* ================= session timer / recorder / presets ================= */
function buildSessBtns(){
  const el=document.getElementById('sessBtns');
  const mins=[0,5,10,15,20,30];
  let html=mins.map(m=>
    `<button class="chip${sessTimerMin===m?' on':''}" data-min="${m}">${m===0?t('timerOff'):t('sessionMin')(m)}</button>`
  ).join('');
  html+=`<button class="chip" id="savePresetBtn">${t('savePreset')}</button>`;
  html+=`<button class="chip rec${recording?' on':''}" id="recBtn"><span class="rec-dot"></span>${recording?t('recStop'):t('recStart')}</button>`;
  el.innerHTML=html;
  el.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{
    sessTimerMin=+b.dataset.min;buildSessBtns();
  });
  document.getElementById('savePresetBtn').onclick=savePreset;
  document.getElementById('recBtn').onclick=toggleRecord;
}
let recording=false,recorder=null,recChunks=[],recDest=null,recStartT=0;
function toggleRecord(){
  if(recording){
    recording=false;
    if(recorder&&recorder.state!=='inactive') recorder.stop();
    buildSessBtns();return;
  }
  initAudio();
  if(!playing){sessionStart=0;setPlaying(true);}
  recDest=AC.createMediaStreamDestination();
  master.connect(recDest);
  recChunks=[];
  recorder=new MediaRecorder(recDest.stream);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  recorder.onstop=()=>{
    const blob=new Blob(recChunks,{type:recorder.mimeType||'audio/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='echo-mo-session.webm';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    master.disconnect(recDest);recDest=null;
  };
  recorder.start();
  recording=true;recStartT=Date.now();
  buildSessBtns();
}
function getPresets(){
  try{return JSON.parse(localStorage.getItem('echomo-presets')||'{}');}catch(e){return{};}
}
function savePreset(){
  const name=prompt(t('presetName'),'My mood');
  if(!name) return;
  const ps=getPresets();
  ps[name]={mood:curMood,voice:curVoice,tempo:SL.tempo(),density:Math.round(SL.density()*100),vol:Math.round(SL.vol()*100)};
  try{localStorage.setItem('echomo-presets',JSON.stringify(ps));}catch(e){}
  buildPresets();
}
function buildPresets(){
  const ps=getPresets(), names=Object.keys(ps);
  const sec=document.getElementById('presetSec');
  sec.style.display=names.length?'block':'none';
  if(!names.length) return;
  const el=document.getElementById('presets');
  el.innerHTML=names.map(n=>`<button class="chip" data-p="${encodeURIComponent(n)}">${n}<span class="x" data-del="${encodeURIComponent(n)}">×</span></button>`).join('');
  el.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=e=>{
      const del=e.target.dataset.del;
      const ps2=getPresets();
      if(del){
        e.stopPropagation();
        delete ps2[decodeURIComponent(del)];
        try{localStorage.setItem('echomo-presets',JSON.stringify(ps2));}catch(e2){}
        buildPresets();return;
      }
      const p=ps2[decodeURIComponent(ch.dataset.p)];
      if(!p) return;
      curMood=p.mood;curVoice=p.voice;
      document.getElementById('sTempo').value=p.tempo;
      document.getElementById('sDensity').value=p.density;
      document.getElementById('sVol').value=p.vol;
      buildMoods();buildVoices();refreshVals();applyLang();
      if(AC&&playing) master.gain.setTargetAtTime(SL.vol()*0.9+0.05,AC.currentTime,0.3);
    };
  });
}
/* ================= ui builders ================= */
function buildMoods(){
  const el=document.getElementById('moods');
  el.innerHTML=t('moods').map((m,i)=>
    `<button class="chip${curMood===i?' on':''}" data-m="${i}"><span class="dot" style="background:${MOODS[i].orb}"></span>${m.n}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curMood=+b.dataset.m;deg=3;buildMoods();
    document.getElementById('npMood').textContent=t('moods')[curMood].n;
    document.getElementById('npSub').textContent=t('moods')[curMood].d;});
}
function buildVoices(){
  const el=document.getElementById('voices');
  el.innerHTML=t('voices').map((v,i)=>
    `<button class="chip${curVoice===i?' on':''}" data-v="${i}">${v.n}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curVoice=+b.dataset.v;buildVoices();});
}
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.getElementById('npMood').textContent=t('moods')[curMood].n;
  document.getElementById('npSub').textContent=t('moods')[curMood].d;
  document.getElementById('footTx').textContent=t('foot');
  document.getElementById('nmTempo').textContent=t('tempo');
  document.getElementById('nmDensity').textContent=t('density');
  document.getElementById('nmVol').textContent=t('vol');
  document.getElementById('lblMood').textContent=t('mood');
  document.getElementById('lblVoice').textContent=t('voice');
  document.getElementById('lblSession').textContent=t('session');
  document.getElementById('lblPreset').textContent=t('preset');
  document.getElementById('kbdHint').textContent=t('kbd');
  buildMoods();buildVoices();buildSessBtns();buildPresets();refreshVals();
}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();});
/* theme */
function applyTheme(th){
  if(th) document.documentElement.dataset.theme=th;
  try{localStorage.setItem('echomo-theme',document.documentElement.dataset.theme);}catch(e){}
}
document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>applyTheme(b.dataset.th));
try{const s=localStorage.getItem('echomo-theme');if(s)document.documentElement.dataset.theme=s;}catch(e){}
/* floating panel */
const fab=document.getElementById('fab'), sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
const fabIcons={
  open:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8a8e" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.3"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.3"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="7" cy="17" r="2.3"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8e" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>'
};
function toggleSheet(open){
  const will=open!==undefined?open:!sheet.classList.contains('open');
  sheet.classList.toggle('open',will);
  scrim.classList.toggle('show',will);
  fab.innerHTML=will?fabIcons.close:fabIcons.open;
}
fab.onclick=()=>toggleSheet();
scrim.onclick=()=>toggleSheet(false);
/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.target!==document.body) return;
  if(e.code==='Space'){e.preventDefault();playBtn.onclick();}
  else if(e.code==='ArrowRight'){curMood=(curMood+1)%MOODS.length;deg=3;buildMoods();applyLang();}
  else if(e.code==='ArrowLeft'){curMood=(curMood+MOODS.length-1)%MOODS.length;deg=3;buildMoods();applyLang();}
  else if(e.code==='ArrowUp'){e.preventDefault();const s=document.getElementById('sVol');s.value=Math.min(100,+s.value+5);refreshVals();
    if(AC&&playing)master.gain.setTargetAtTime(SL.vol()*0.9+0.05,AC.currentTime,0.1);}
  else if(e.code==='ArrowDown'){e.preventDefault();const s=document.getElementById('sVol');s.value=Math.max(0,+s.value-5);refreshVals();
    if(AC&&playing)master.gain.setTargetAtTime(SL.vol()*0.9+0.05,AC.currentTime,0.1);}
});
document.getElementById('sVol').addEventListener('input',()=>{
  if(AC&&playing) master.gain.setTargetAtTime(SL.vol()*0.9+0.05,AC.currentTime,0.1);
});
/* ================= visuals ================= */
function fmtTime(ms){
  const s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
setInterval(()=>{
  const el=document.getElementById('sessInfo');
  if(!playing||!sessionStart){el.textContent=t('sessionIdle');return;}
  const elapsed=Date.now()-sessionStart;
  let tx=fmtTime(elapsed)+' · '+noteCount+(lang==='zh'?' 音':' notes');
  if(sessTimerMin>0){
    const remain=Math.max(0,sessTimerMin*60000-elapsed);
    tx+=' · −'+fmtTime(remain);
  }
  if(recording) tx+=' · ● '+fmtTime(Date.now()-recStartT);
  el.textContent=tx;
},500);
function render(time){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const M=MOODS[curMood];
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,M.bg[0]);bg.addColorStop(1,M.bg[1]);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.13)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // dust
  ctx.fillStyle=M.dust;
  for(let i=0;i<24;i++){
    const px=((i*197.3+time*0.005*(1+(i%3)*0.4))%(W+40))-20;
    const py=((i*311.7+time*0.0035*(1+(i%2)*0.5))%(H+40))-20;
    ctx.beginPath();ctx.arc(px,py,1.0+(i%3)*0.6,0,6.2832);ctx.fill();
  }
  // orbs
  const now=performance.now();
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i], age=now-o.born;
    if(age>o.life){orbs.splice(i,1);continue;}
    const k=age/o.life;
    const x=o.x+o.vx*k*8+Math.sin(age*0.0009+i)*9;
    const y=o.y+o.vy*k*8;
    const a=(1-k)*0.5*(k<0.12?k/0.12:1);
    const rr=o.r*(0.6+k*0.9);
    const grd=ctx.createRadialGradient(x,y,0,x,y,rr);
    grd.addColorStop(0,o.hue);grd.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalAlpha=Math.max(0,a);
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(x,y,rr,0,6.2832);ctx.fill();
    ctx.globalAlpha=Math.max(0,a*0.45);
    ctx.strokeStyle=o.hue;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x,y,rr*0.55,0,6.2832);ctx.stroke();
  }
  ctx.globalAlpha=1;
  // pitch hairline
  const ly=H*0.80;
  ctx.strokeStyle=M.line;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(40,ly);ctx.lineTo(W-40,ly);ctx.stroke();
  for(let i=scoreDots.length-1;i>=0;i--){
    const d=scoreDots[i], age=now-d.born;
    if(age>9000){scoreDots.splice(i,1);continue;}
    const x=d.x-(age/9000)*(W-140);
    const y=ly-8-d.pitch*46;
    ctx.globalAlpha=Math.max(0,0.75*(1-age/9000));
    ctx.fillStyle=M.orb;
    ctx.beginPath();ctx.arc(x,y,2.4,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(render);
}
/* ================= boot ================= */
applyTheme();applyLang();refreshVals();
requestAnimationFrame(render);
