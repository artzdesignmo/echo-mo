<!DOCTYPE html>
<html lang="en" data-theme="silver">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo Mo — Generative Ambient Music Studio</title>
<meta name="description" content="Echo Mo: a generative ambient music studio. Every note composed by code, in real time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e8e6; --panel:rgba(247,247,245,.82); --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e;
  --line:#d8d8d4; --accent:#8a6f4d; --radius:14px;
}
[data-theme="white"]{ --bg:#f4f4f4; --panel:rgba(255,255,255,.85); --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e; --line:#e2e2e2; }
[data-theme="black"]{ --bg:#141414; --panel:rgba(30,30,30,.82); --card:#242424; --ink:#f2f2f2; --ink2:#a8a8a8; --line:#333; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; overflow:hidden; }
body{ font-family:'Noto Sans TC','Noto Sans',sans-serif; background:var(--bg); color:var(--ink); }
#cv{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
.serif{ font-family:'Cormorant Garamond','Noto Sans TC',serif; }
/* top bar */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background:linear-gradient(to bottom, var(--panel), transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.brand .t{ font-family:'Dela Gothic One'; font-size:20px; letter-spacing:2px; }
.brand .s{ font-size:10px; color:var(--ink2); letter-spacing:4px; margin-top:2px; }
.hctl{ display:flex; align-items:center; gap:10px; }
.seg{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
.seg button{ border:0; background:transparent; color:var(--ink2); padding:7px 13px; cursor:pointer; font-size:12px; font-weight:500; }
.seg button.on{ background:var(--ink); color:var(--bg); }
.tbtn{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); cursor:pointer; }
/* center play */
#stage{
  position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
  align-items:center; justify-content:center; pointer-events:none;
}
#playBtn{
  pointer-events:auto; width:92px; height:92px; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  transition:transform .25s, border-color .25s;
  animation:breathe 4s ease-in-out infinite;
}
#playBtn:hover{ transform:scale(1.06); border-color:var(--ink2); }
@keyframes breathe{ 0%,100%{ box-shadow:0 0 0 0 rgba(138,111,77,.18);} 50%{ box-shadow:0 0 0 22px rgba(138,111,77,0);} }
#playBtn svg{ width:34px; height:34px; fill:var(--ink); margin-left:4px; }
#playBtn.playing svg{ margin-left:0; }
#nowPlaying{
  margin-top:26px; text-align:center; pointer-events:none;
  font-size:15px; letter-spacing:6px; color:var(--ink2); font-weight:300;
}
#nowPlaying .serif{ font-size:26px; letter-spacing:3px; color:var(--ink); display:block; margin-bottom:6px; font-style:italic; }
/* bottom controls */
.controls{
  position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:50;
  background:var(--panel); border:1px solid var(--line); border-radius:20px;
  padding:14px 20px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  display:flex; flex-direction:column; gap:12px; max-width:min(640px,94vw);
  box-shadow:0 8px 32px rgba(0,0,0,.10);
}
.moods{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.mood{
  border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:8px 18px; cursor:pointer; font-size:13px; color:var(--ink2);
  display:flex; align-items:center; gap:8px; transition:all .2s;
}
.mood .dot{ width:10px; height:10px; border-radius:50%; }
.mood.on{ border-color:var(--accent); color:var(--ink); font-weight:600; }
.sliders{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
.sl{ display:flex; align-items:center; gap:10px; }
.sl .nm{ font-size:12px; color:var(--ink2); letter-spacing:1px; white-space:nowrap; }
.sl .val{ font-size:12px; color:var(--ink2); min-width:52px; text-align:right; }
input[type=range]{ width:110px; accent-color:var(--accent); cursor:pointer; }
#count{ position:fixed; right:18px; bottom:18px; z-index:40; font-size:11px; color:var(--ink2); letter-spacing:2px; pointer-events:none; }
footer{ position:fixed; left:18px; bottom:18px; z-index:40; font-size:11px; color:var(--ink2); letter-spacing:1px; pointer-events:none; }
footer a{ color:var(--ink2); pointer-events:auto; }
@media (max-width:640px){
  .topbar{ padding:10px 14px; } .brand .t{ font-size:16px; }
  #playBtn{ width:76px; height:76px; }
  .controls{ padding:12px 14px; bottom:12px; }
  input[type=range]{ width:84px; }
  footer{ display:none; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="topbar">
  <div class="brand"><div class="t">ECHO MO</div><div class="s">GENERATIVE AMBIENT MUSIC</div></div>
  <div class="hctl">
    <div class="seg" id="langSeg"><button data-l="en" class="on">EN</button><button data-l="zh">中</button></div>
    <button class="tbtn" data-th="white" style="background:#fff" title="white"></button>
    <button class="tbtn" data-th="silver" style="background:#d8d8d8" title="silver"></button>
    <button class="tbtn" data-th="black" style="background:#222" title="black"></button>
  </div>
</div>
<div id="stage">
  <button id="playBtn" aria-label="play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
  <div id="nowPlaying"><span class="serif" id="npMood">Dawn</span><span id="npSub"></span></div>
</div>
<div class="controls">
  <div class="moods" id="moods"></div>
  <div class="sliders">
    <div class="sl"><span class="nm" id="nmTempo">Tempo</span><input type="range" id="sTempo" min="40" max="120" value="62"><span class="val" id="vTempo"></span></div>
    <div class="sl"><span class="nm" id="nmDensity">Density</span><input type="range" id="sDensity" min="0" max="100" value="45"><span class="val" id="vDensity"></span></div>
    <div class="sl"><span class="nm" id="nmVol">Volume</span><input type="range" id="sVol" min="0" max="100" value="70"><span class="val" id="vVol"></span></div>
  </div>
</div>
<div id="count"></div>
<footer>ECHO MO · <span id="footTx"></span> · <a href="https://buymeacoffee.com/whynotartmoney" target="_blank" rel="noopener">Buy Me a Coffee</a></footer>
<script>
/* ================= i18n ================= */
const STR={
  en:{sub:'every note composed by code',foot:'every note composed by code',
      tempo:'Tempo',density:'Density',vol:'Volume',
      moods:[
        {n:'Dawn',d:'warm morning light'},
        {n:'Dusk',d:'amber hour'},
        {n:'Night',d:'deep indigo stillness'},
        {n:'Zen',d:'a single stone in still water'}
      ],
      count:n=>n+(n===1?' note':' notes')},
  zh:{sub:'每一個音符都由代碼寫成',foot:'每一個音符都由代碼寫成',
      tempo:'速度',density:'密度',vol:'音量',
      moods:[
        {n:'晨',d:'溫暖的晨光'},
        {n:'暮',d:'琥珀色的黃昏'},
        {n:'夜',d:'深藍的靜'},
        {n:'禪',d:'靜水中的一顆石'}
      ],
      count:n=>'已奏 '+n+' 音'}
};
let lang='en';
const t=k=>STR[lang][k];
/* ================= moods ================= */
const MOODS=[
  {id:'dawn', scale:[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25],
   root:261.63, orb:'#d9a45b', bg:['#f7ecd9','#e8d5b5'], line:'rgba(138,111,77,.35)', dust:'rgba(138,111,77,.25)'},
  {id:'dusk', scale:[220.00,261.63,293.66,329.63,392.00,440.00,523.25],
   root:220.00, orb:'#c47a6d', bg:['#f2ddd4','#dfc0b2'], line:'rgba(150,90,80,.35)', dust:'rgba(150,90,80,.25)'},
  {id:'night', scale:[146.83,174.61,196.00,220.00,261.63,293.66,349.23],
   root:146.83, orb:'#9db4d8', bg:['#1b2340','#0e1428'], line:'rgba(157,180,216,.30)', dust:'rgba(157,180,216,.22)'},
  {id:'zen', scale:[659.25,783.99,880.00,987.77,1174.66,1318.51],
   root:659.25, orb:'#8a8a8e', bg:['#f5f1e6','#e6dfcd'], line:'rgba(90,85,70,.35)', dust:'rgba(90,85,70,.20)'},
];
let curMood=0;
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.getElementById('npSub').textContent=t('sub');
  document.getElementById('footTx').textContent=t('foot');
  document.getElementById('nmTempo').textContent=t('tempo');
  document.getElementById('nmDensity').textContent=t('density');
  document.getElementById('nmVol').textContent=t('vol');
  buildMoods();updateCount();refreshVals();
  document.getElementById('npMood').textContent=t('moods')[curMood].n;
}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();});
/* ================= theme ================= */
function applyTheme(th){
  if(th) document.documentElement.dataset.theme=th;
  try{localStorage.setItem('echomo-theme',document.documentElement.dataset.theme);}catch(e){}
}
document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>applyTheme(b.dataset.th));
try{const s=localStorage.getItem('echomo-theme');if(s)document.documentElement.dataset.theme=s;}catch(e){}
/* ================= canvas ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=1,W=0,H=0;
function sizeCanvas(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
}
window.addEventListener('resize',sizeCanvas);sizeCanvas();
/* ================= audio ================= */
let AC=null,master,verb,playing=false,noteCount=0;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
  // generated impulse reverb
  const len=AC.sampleRate*2.8, imp=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=imp.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);
  }
  verb=AC.createConvolver();verb.buffer=imp;
  const wet=AC.createGain();wet.gain.value=0.55;
  verb.connect(wet);wet.connect(master);
}
function playNote(freq,time,dur,vol){
  const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=freq;
  const o2=AC.createOscillator();o2.type='triangle';o2.frequency.value=freq*2;
  const g=AC.createGain(),g2=AC.createGain();g2.gain.value=0.12;
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0011,vol),time+0.025);
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
  o1.connect(g);o2.connect(g2);g2.connect(g);
  g.connect(master);g.connect(verb);
  o1.start(time);o2.start(time);
  o1.stop(time+dur+0.1);o2.stop(time+dur+0.1);
}
function playPad(freqs,time,dur,vol){
  for(const fq of freqs){
    const o=AC.createOscillator();o.type='sine';o.frequency.value=fq;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,time);
    g.gain.linearRampToValueAtTime(vol,time+dur*0.35);
    g.gain.linearRampToValueAtTime(0.0001,time+dur);
    o.connect(g);g.connect(master);g.connect(verb);
    o.start(time);o.stop(time+dur+0.1);
  }
}
/* ================= generative engine ================= */
let schedTimer=null,nextTime=0,deg=3,beatCount=0,orbs=[],scoreDots=[];
const SL={
  tempo:()=>+document.getElementById('sTempo').value,
  density:()=>+document.getElementById('sDensity').value/100,
  vol:()=>+document.getElementById('sVol').value/100,
};
function refreshVals(){
  document.getElementById('vTempo').textContent=SL.tempo()+' bpm';
  document.getElementById('vDensity').textContent=Math.round(SL.density()*100)+'%';
  document.getElementById('vVol').textContent=Math.round(SL.vol()*100)+'%';
}
['sTempo','sDensity','sVol'].forEach(id=>document.getElementById(id).addEventListener('input',refreshVals));
function buildMoods(){
  const el=document.getElementById('moods');
  el.innerHTML=t('moods').map((m,i)=>
    `<button class="mood${curMood===i?' on':''}" data-m="${i}"><span class="dot" style="background:${MOODS[i].orb}"></span>${m.n}</button>`
  ).join('');
  el.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{curMood=+b.dataset.m;deg=3;buildMoods();
    document.getElementById('npMood').textContent=t('moods')[curMood].n;});
}
function schedule(){
  const spb=60/SL.tempo();
  while(nextTime<AC.currentTime+0.4){
    const M=MOODS[curMood], dens=SL.density(), vol=SL.vol();
    // melody random walk
    const r=Math.random();
    if(r<0.55) deg+=Math.random()<0.5?-1:1;
    else if(r<0.78) deg+=Math.random()<0.5?-2:2;
    else if(r<0.88){/* repeat */}
    else deg+=Math.random()<0.5?-3:3;
    deg=Math.max(0,Math.min(M.scale.length-1,deg));
    // drift back to middle
    if(Math.random()<0.3) deg+=Math.sign((M.scale.length-1)/2-deg);
    deg=Math.max(0,Math.min(M.scale.length-1,deg));
    const restP=0.72-dens*0.55+(curMood===3?0.18:0);
    if(Math.random()>restP){
      const freq=M.scale[deg];
      const dur=spb*(1.5+Math.random()*2.5);
      playNote(freq,nextTime,dur,0.22*vol+0.05);
      spawnOrb(freq,nextTime);
      noteCount++;updateCount();
    }
    // pad every 16 beats
    if(beatCount%16===0){
      playPad([M.root,M.root*1.5,M.root*2],nextTime,spb*16,0.028*vol+0.004);
    }
    // sparse bell
    if(Math.random()<0.06+dens*0.05){
      const bf=M.scale[M.scale.length-1]*2;
      playNote(bf,nextTime+spb*0.5,spb*4,0.06*vol);
    }
    beatCount++;
    nextTime+=spb*(Math.random()<dens*0.5?0.5:1);
  }
}
function spawnOrb(freq,atTime){
  const M=MOODS[curMood];
  const delay=Math.max(0,(atTime-AC.currentTime)*1000);
  setTimeout(()=>{
    const norm=(freq-M.scale[0])/(M.scale[M.scale.length-1]-M.scale[0]);
    orbs.push({x:W*(0.15+Math.random()*0.7), y:H*(0.55+Math.random()*0.25),
      r:6+norm*26+Math.random()*8, born:performance.now(), life:7000+Math.random()*3000,
      vx:(Math.random()-0.5)*12, vy:-14-Math.random()*16, hue:M.orb, pitch:norm});
    if(orbs.length>90) orbs.shift();
    scoreDots.push({x:W-70, pitch:norm, born:performance.now()});
    if(scoreDots.length>60) scoreDots.shift();
  },delay);
}
/* ================= transport ================= */
const playBtn=document.getElementById('playBtn'),playIcon=document.getElementById('playIcon');
function setPlaying(p){
  playing=p;
  playBtn.classList.toggle('playing',p);
  playIcon.innerHTML=p?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  if(p){
    initAudio();
    if(AC.state==='suspended') AC.resume();
    master.gain.setTargetAtTime(SL.vol()*0.9+0.05,AC.currentTime,0.4);
    nextTime=AC.currentTime+0.1;
    schedTimer=setInterval(schedule,120);
  }else{
    clearInterval(schedTimer);
    if(AC) master.gain.setTargetAtTime(0.0001,AC.currentTime,0.3);
  }
}
playBtn.onclick=()=>setPlaying(!playing);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target===document.body){e.preventDefault();setPlaying(!playing);}
});
document.getElementById('sVol').addEventListener('input',()=>{
  if(AC&&playing) master.gain.setTargetAtTime(SL.vol()*0.9+0.05,AC.currentTime,0.1);
});
/* ================= visuals ================= */
function updateCount(){document.getElementById('count').textContent=t('count')(noteCount);}
function render(time){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const M=MOODS[curMood];
  // background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,M.bg[0]);bg.addColorStop(1,M.bg[1]);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.14)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // drifting dust
  ctx.fillStyle=M.dust;
  const dn=26;
  for(let i=0;i<dn;i++){
    const px=((i*197.3+time*0.006*(1+(i%3)*0.4))%(W+40))-20;
    const py=((i*311.7+time*0.004*(1+(i%2)*0.5))%(H+40))-20;
    ctx.beginPath();ctx.arc(px,py,1.1+(i%3)*0.7,0,6.2832);ctx.fill();
  }
  // orbs
  const now=performance.now();
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i], age=now-o.born;
    if(age>o.life){orbs.splice(i,1);continue;}
    const k=age/o.life;
    const x=o.x+o.vx*k*8+Math.sin(age*0.001+i)*10;
    const y=o.y+o.vy*k*8;
    const a=(1-k)*0.55*(k<0.12?k/0.12:1);
    const rr=o.r*(0.6+k*0.9);
    const grd=ctx.createRadialGradient(x,y,0,x,y,rr);
    grd.addColorStop(0,o.hue);grd.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalAlpha=Math.max(0,a);
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(x,y,rr,0,6.2832);ctx.fill();
    // ring
    ctx.globalAlpha=Math.max(0,a*0.5);
    ctx.strokeStyle=o.hue;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x,y,rr*0.55,0,6.2832);ctx.stroke();
  }
  ctx.globalAlpha=1;
  // pitch hairline (bottom)
  const ly=H*0.82;
  ctx.strokeStyle=M.line;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(40,ly);ctx.lineTo(W-40,ly);ctx.stroke();
  for(let i=scoreDots.length-1;i>=0;i--){
    const d=scoreDots[i], age=now-d.born;
    if(age>9000){scoreDots.splice(i,1);continue;}
    const x=d.x-(age/9000)*(W-140);
    const y=ly-8-d.pitch*46;
    ctx.globalAlpha=Math.max(0,0.8*(1-age/9000));
    ctx.fillStyle=M.orb;
    ctx.beginPath();ctx.arc(x,y,2.6,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(render);
}
/* ================= boot ================= */
applyTheme();applyLang();buildMoods();refreshVals();updateCount();
requestAnimationFrame(render);
</script>
</body>
</html>
